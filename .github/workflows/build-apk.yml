name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Warehouse Map APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Capacitor project
        run: |
          mkdir -p app/www

          cp index.html app/www/index.html

          if [ -f warehouse-plan.png ]; then
            cp warehouse-plan.png app/www/warehouse-plan.png
          fi

          cd app

          cat > package.json <<'EOF'
          {
            "name": "warehouse-map",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.5.2",
              "@capacitor/android": "^8.5.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.5.2"
            }
          }
          EOF

          npm install

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.hlebish.warehousemap",
            "appName": "Карта склада",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
            release/warehouse-map.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-map-android
          path: release/warehouse-map.apk