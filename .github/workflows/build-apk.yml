name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Warehouse Map APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

          mkdir -p ~/.android

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

          echo "Stable debug keystore restored."

      - name: Show SHA fingerprints
        run: |
          echo "========================================"
          echo "ANDROID DEBUG SHA-1:"
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep "SHA1:"
          echo ""
          echo "ANDROID DEBUG SHA-256:"
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep "SHA256:"
          echo "========================================"

      - name: Create Capacitor project
        run: |
          mkdir -p app/www

          cp index.html app/www/index.html

          if [ -f warehouse-plan.png ]; then
            cp warehouse-plan.png app/www/warehouse-plan.png
          fi

          cd app

          cat > package.json <<'EOF'
          {
            "name": "warehouse-map",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.5.2",
              "@capacitor/android": "^8.5.2",
              "@capacitor-firebase/authentication": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.5.2"
            }
          }
          EOF

          npm install

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.hlebish.warehousemap",
            "appName": "Карта склада",
            "webDir": "www",
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": [
                  "google.com"
                ]
              }
            }
          }
          EOF

          npx cap add android

          # Configure Google Services Gradle plugin
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          text = p.read_text()

          old_marker = "com.google.gms:google-services:"
          new_line = "        classpath 'com.google.gms:google-services:4.5.0'"

          lines = text.splitlines()

          found = False

          for i, line in enumerate(lines):
              if old_marker in line:
                  lines[i] = new_line
                  found = True
                  break

          if not found:
              needle = "dependencies {"
              pos = text.find(needle)

              if pos == -1:
                  raise SystemExit(
                      "ERROR: android/build.gradle: dependencies block not found"
                  )

              insert_pos = pos + len(needle)

              text = (
                  text[:insert_pos]
                  + "\n\n"
                  + new_line
                  + text[insert_pos:]
              )
          else:
              text = "\n".join(lines) + "\n"

          p.write_text(text)
          PY

          # Apply Google Services plugin to the app module
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          marker = "apply plugin: 'com.google.gms.google-services'"

          if marker not in text:
              text += "\n\n" + marker + "\n"
              p.write_text(text)
          PY

          # Enable Google provider dependencies for Capacitor Firebase Authentication
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          text = p.read_text()

          marker = "    rgcfaIncludeGoogle = true"

          if marker not in text:
              pos = text.rfind("}")

              if pos == -1:
                  raise SystemExit(
                      "ERROR: variables.gradle: closing brace not found"
                  )

              text = (
                  text[:pos]
                  + "    rgcfaIncludeGoogle = true\n"
                  + "    androidxCredentialsVersion = '1.3.0'\n"
                  + text[pos:]
              )

              p.write_text(text)
          PY

          npx cap sync android
          npx cap update android
          echo "=== CHECK GOOGLE SERVICES RESOURCES ==="
          find app/android/app/build/generated/res -path '*google-services*/values.xml' -print -exec cat {} \; || true
          echo "=== END GOOGLE SERVICES CHECK ==="

      - name: Add Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: FIREBASE_GOOGLE_SERVICES_JSON secret is not configured."
            exit 1
          fi

          echo "$FIREBASE_GOOGLE_SERVICES_JSON" > app/android/app/google-services.json

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release

          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
            release/warehouse-map.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-map-android
          path: release/warehouse-map.apk
