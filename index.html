<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивная карта склада</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#18212b;--muted:#66717d;--accent:#1f6feb;--empty:#e8edf2;--filled:#7ccf8a;--border:#c8d0d8;--search:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#17212b;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}
h1{margin:0 0 8px;font-size:24px}.sub{font-size:13px;color:#cbd5df}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
input,button{font:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:#fff}
button{cursor:pointer;font-weight:600}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:12px;max-width:1500px;width:100%;margin:auto;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--border)}
.sync{font-weight:700}.sync.ok{color:#2e6b3b}.sync.warn{color:#9a6500}.sync.err{color:#b42318}
.map{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px}
.street{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 2px 7px #0000000b;min-width:0}
.street h2{margin:0 0 10px;text-align:center;background:#17212b;color:white;border-radius:9px;padding:8px;font-size:18px}
.sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.sides.single-side{grid-template-columns:1fr}
.side{min-width:0}.side h3{font-size:13px;text-align:center;margin:5px 0 7px;color:var(--muted)}
.shelf{border:1px solid #9eaab5;border-radius:8px;overflow:hidden;margin-bottom:9px;background:#fafbfc}
.shelf-title{padding:5px 7px;background:#f0f3f6;font-weight:700;text-align:center;font-size:13px;color:#000}
.cells{display:grid;grid-template-columns:repeat(5,32px);gap:5px;padding:6px;justify-content:center}
.cell{width:32px;height:30px;min-height:30px;border:1px solid #b9c2ca;border-radius:6px;background:var(--empty);font-size:11px;padding:0;cursor:pointer;text-align:center}
.cell:hover{outline:2px solid var(--accent);outline-offset:1px;z-index:1}.cell.filled{background:var(--filled);font-weight:700}
.cell.search-hit{background:var(--search)!important;color:#fff!important;border-color:#b91c1c;box-shadow:0 0 0 2px #ef444466,0 2px 8px #ef444466}
.stats{margin:10px 0;color:var(--muted);font-size:13px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}
.filters select,.filters button{padding:8px 10px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px}
.stat-card b{display:block;font-size:18px;color:var(--ink)}
.stat-card span{font-size:12px;color:var(--muted)}
.result-row{display:flex;gap:7px;align-items:center}
.result-main{flex:1;min-width:0}
.copy-btn{padding:5px 8px;font-size:12px}
.cell.filter-hidden{display:none}
.shelf.filter-empty{display:none}
.street.filter-hidden{display:none}
.cell.focused{animation:cellFocus 1.8s ease}
@keyframes cellFocus{0%,100%{transform:scale(1)}25%,70%{transform:scale(1.18);outline:3px solid var(--accent);z-index:4}}
.history-dialog{width:min(760px,100%)}
.history-item{border-bottom:1px solid var(--border);padding:9px 0;font-size:13px}
.history-item small{color:var(--muted)}

#modal,#specialModal,#historyModal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#specialModal{z-index:30}.dialog{background:white;border-radius:14px;width:min(520px,100%);padding:18px;box-shadow:0 10px 40px #0005}
.dialog h2{margin-top:0}.addr{font-family:monospace;color:var(--accent);font-weight:700}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}
textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:10px;font:inherit}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.result{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin:7px 0;cursor:pointer}
.result strong{display:block;color:#1264d8;font-size:14px}
.result .article{display:block;margin-top:5px;color:#222;font-size:13px;font-weight:700}
 .result:hover{border-color:var(--accent)}

.search-head{margin:10px 0 7px;padding:9px 11px;background:#fff;border:1px solid var(--border);border-radius:10px;color:#25313d}
.search-result{position:relative;display:grid;grid-template-columns:105px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;margin:7px 0;background:#fff;border:2px solid #ef4444;border-radius:10px;cursor:pointer;box-shadow:0 2px 7px #0000000b}
.search-result:hover{border-color:#b91c1c;background:#fff7f7}
.result-address{font-family:monospace;font-size:15px;font-weight:800;color:#b42318;background:#fee2e2;border-radius:7px;padding:7px 8px;text-align:center}
.result-content{min-width:0}
.search-item{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 0}
.search-item b{font-size:14px;color:#18212b}
.search-item span{font-size:13px;color:#53606c}
.search-empty{color:var(--muted)}
.special-result{grid-template-columns:190px minmax(0,1fr)}
@media(max-width:600px){.search-result{grid-template-columns:1fr auto}.result-content{grid-column:1/-1}.special-result{grid-template-columns:1fr}}
.special-storage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px auto;max-width:1500px;padding:0 12px}
.special-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 2px 7px #0000000b;min-width:0}
.special-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:54px;padding:9px;border:1px solid #b9c2ca;border-radius:8px;background:#f5f7f9;color:#25313d;cursor:pointer;font:inherit}
.special-cell:hover{background:#eaf0f5;border-color:#8d9aa7;box-shadow:0 2px 7px #00000012}.special-cell:active{transform:scale(.985)}
.special-cell strong{font-size:13px}.special-cell small{max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#53606c;font-weight:400}
.special-cell.filled{background:var(--filled);border-color:#9bbba3}.special-cell.filled strong{color:#2e5b39}
@media(min-width:1100px){
 main{padding:14px 18px}.map{grid-template-columns:minmax(125px,1fr) repeat(4,minmax(235px,2fr));gap:8px}
 .street{padding:7px}.street h2{font-size:15px;padding:6px}.sides{gap:6px}.side h3{font-size:9px}
 .shelf-title{font-size:9px;padding:3px}.cells{grid-template-columns:repeat(5,22px);gap:3px;padding:5px}
 .cell{width:22px;min-width:22px;height:23px;min-height:23px;font-size:9px}
}
@media(max-width:1099px){.map{grid-template-columns:1fr}.street{width:100%}.sides{gap:8px}.cells{grid-template-columns:repeat(5,30px);gap:5px}.cell{width:30px;min-width:30px;height:29px;min-height:29px;font-size:10px}.side h3{font-size:10px}.shelf-title{font-size:10px}}
@media(max-width:520px){main{padding:8px}.map{gap:8px}.street{padding:6px}.sides{gap:5px}.cells{grid-template-columns:repeat(5,27px);gap:4px;padding:5px}.cell{width:27px;min-width:27px;height:27px;min-height:27px}.special-storage{grid-template-columns:1fr;gap:8px;padding:0 8px}.special-cell{min-height:52px}}
#loginScreen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}

#loginBox{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:30px;
  width:360px;
  max-width:90%;
  text-align:center;
  box-shadow:0 10px 40px #000;
}

#loginBox h2{
  margin-top:0;
}

#loginBox p{
  color:var(--muted);
  margin-bottom:20px;
}
</style>
</head>
<body>

<div id="loginScreen" style="
  position:fixed;
  inset:0;
  z-index:9999;
  background:#121212;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:Arial,sans-serif;
">
  <div style="
    background:#1e1e1e;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    max-width:360px;
    width:calc(100% - 40px);
  ">
    <h2 style="margin-top:0;color:#fff;">🔐 Доступ к складу</h2>

    <p style="color:#aaa;margin-bottom:25px;">
      Войдите через Google, чтобы открыть карту склада.
    </p>

    <button onclick="loginWithGoogle()" style="
      width:100%;
      padding:12px 18px;
      border:0;
      border-radius:10px;
      background:#fff;
      color:#222;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    ">
      Войти через Google
    </button>

    <div id="loginError" style="
      color:#ff6b6b;
      margin-top:15px;
      font-size:13px;
      display:none;
    "></div>
  </div>
</div>

<header>
<h1>📦 Интерактивная карта склада</h1>
<div class="sub">Адрес: улица (S1–S5) → полка (A–E слева / F–K справа)</div>
<div class="toolbar">
<input id="search" type="search" placeholder="🔎 Поиск детали, артикула, адреса — можно с ошибками…" style="flex:1 1 360px;min-width:220px">
<button class="primary" onclick="document.getElementById('excelFile').click()">📥 Excel</button>
<button onclick="exportExcel()">📤 Экспорт</button>
<button onclick="showHistory()">🕘 История</button>
<input id="excelFile" type="file" accept=".xlsx,.xls" style="display:none">
</div>
<div class="filters">
<select id="filterStatus"><option value="all">Все ячейки</option><option value="filled">Только занятые</option><option value="empty">Только свободные</option></select>
<select id="filterStreet"><option value="all">Все улицы</option><option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option></select>
<select id="filterSide"><option value="all">Все стороны</option><option value="left">Левая A–E</option><option value="right">Правая F–K</option></select>
<select id="filterType"><option value="all">Все детали</option><option value="капот">Капоты</option><option value="бампер">Бамперы</option><option value="крыло">Крылья</option><option value="дверь">Двери</option><option value="фара">Фары</option><option value="фонарь">Фонари</option><option value="решетка">Решётки</option><option value="other">Другое</option></select>
<button onclick="resetFilters()">✖ Сбросить фильтры</button>
</div>
</header>
<main>
<div class="legend">
<span><i class="dot" style="background:var(--empty)"></i>пустая</span>
<span><i class="dot" style="background:var(--filled)"></i>занята</span>
<span>Нажми на ячейку — откроется карточка хранения.</span>
<span id="syncStatus" class="sync warn">☁️ Подключение к Firebase…</span>
</div>
<div id="results"></div>
<div id="stats" class="stats"></div>
<div id="map" class="map"></div>
</main>

<div class="special-storage">
<section class="special-box"><button class="special-cell" id="resaleCell" onclick="openSpecial('resale')"><strong>Перекупной товар</strong><small id="resalePreview"></small></button></section>
<section class="special-box"><button class="special-cell" id="defectCell" onclick="openSpecial('defect')"><strong>Брак</strong><small id="defectPreview"></small></button></section>
</div>

<div id="specialModal"><div class="dialog">
<h2 id="specialTitle"></h2><label>Что находится здесь</label>
<textarea id="specialContent" placeholder="Например: APHD4307 — 1 шт.&#10;Можно указать несколько артикулов."></textarea>
<div class="actions"><button onclick="closeSpecial()">Отмена</button><button class="primary" onclick="saveSpecial()">Сохранить</button></div>
</div></div>

<div id="historyModal"><div class="dialog history-dialog">
<h2>🕘 История изменений</h2>
<div id="historyList">Загрузка…</div>
<div class="actions"><button onclick="closeHistory()">Закрыть</button></div>
</div></div>

<div id="modal"><div class="dialog">
<h2>Ячейка <span id="addr" class="addr"></span></h2><label>Что лежит в ячейке</label>
<textarea id="content" placeholder="Например: APHD4307 — капот Honda, 2 шт.&#10;Можно указать несколько позиций."></textarea>
<div class="actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveCell()">Сохранить</button></div>
</div></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyAFd_IPlACJlpxeGsNE7Iq3dQm-VYu5Ba4",
    authDomain: "warehouse-map-b6ed6.firebaseapp.com",
    databaseURL: "https://warehouse-map-b6ed6-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "warehouse-map-b6ed6",
    storageBucket: "warehouse-map-b6ed6.firebasestorage.app",
    messagingSenderId: "196261680344",
    appId: "1:196261680344:web:fdd54671cf57690744f3ad",
    measurementId: "G-7GZFEYSDSJ"
};

firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

const db=firebase.database();
 
const rootRef=db.ref("warehouse");
 function loginWithGoogle(){
  auth.signInWithPopup(provider)
    .catch(error => {
      const el = document.getElementById("loginError");
      el.textContent = "Ошибка входа: " + error.message;
      el.style.display = "block";
    });
}

async function loadWarehouseData(){
  try{
    setSync("☁️ Загрузка склада…","warn");
    const snap=await rootRef.once("value");
    const remote=snap.val()||{};

    // Поддерживаем текущую структуру Firebase: warehouse/cells + warehouse/special.
    // Для совместимости также принимаем старый вариант, где S1...S5 лежат прямо в warehouse.
    const remoteCells=remote.cells || (remote.S1 ? remote : null);
    if(remoteCells){
      data=normalizeData(remoteCells);
    }else{
      const local=JSON.parse(localStorage.getItem("warehouseMapData")||"null");
      data=normalizeData(local);
    }

    if(remote.special){
      specialData={
        resale:String(remote.special.resale||""),
        defect:String(remote.special.defect||"")
      };
    }else{
      const localSpecial=JSON.parse(localStorage.getItem("warehouseSpecialData")||"null");
      specialData={
        resale:String(localSpecial?.resale||""),
        defect:String(localSpecial?.defect||"")
      };
    }

    remoteLoaded=true;
    setLocal();
    render();
    doSearch();
    setSync("☁️ Синхронизировано","ok");
  }catch(e){
    console.error("Ошибка загрузки Firebase:",e);
    remoteLoaded=false;
    const local=JSON.parse(localStorage.getItem("warehouseMapData")||"null");
    const localSpecial=JSON.parse(localStorage.getItem("warehouseSpecialData")||"null");
    data=normalizeData(local);
    specialData={resale:String(localSpecial?.resale||""),defect:String(localSpecial?.defect||"")};
    render();
    doSearch();
    setSync("⚠️ Firebase недоступен — показана локальная копия","err");
  }
}

auth.onAuthStateChanged(user => {
  const loginScreen = document.getElementById("loginScreen");

  if (user) {
    loginScreen.style.display = "none";
    loadWarehouseData();
  } else {
    loginScreen.style.display = "flex";
    setSync("🔐 Требуется вход","warn");
  }
});

const letters=["A","B","C","D","E","F","G","H","J","K"];
const leftLetters=["A","B","C","D","E"];
const rightLetters=["F","G","H","J","K"];
let data=createEmptyData(), specialData={resale:"",defect:""}, current=null, currentSpecial=null;
let remoteLoaded=false;

function createEmptyData(){
 const d={};
 for(let s=1;s<=5;s++){d["S"+s]={};for(const l of letters){d["S"+s][l]={};for(let n=1;n<=10;n++)d["S"+s][l][String(n)]="";}}
 return d;
}
function address(s,l,n){return `${s}-${l}-${n}`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function hasLocalData(){
 const d=JSON.parse(localStorage.getItem("warehouseMapData")||"null");
 const sp=JSON.parse(localStorage.getItem("warehouseSpecialData")||"null");
 return !!(d && Object.values(d).some(st=>Object.values(st).some(sh=>Object.values(sh).some(v=>String(v||"").trim())))) ||
        !!(sp && Object.values(sp).some(v=>String(v||"").trim()));
}
function normalizeData(d){
 const out=createEmptyData();
 if(!d)return out;
 for(let s=1;s<=5;s++)for(const l of letters)for(let n=1;n<=10;n++){
  out["S"+s][l][String(n)]=d?.["S"+s]?.[l]?.[String(n)]||"";
 }
 return out;
}
function setLocal(){
 localStorage.setItem("warehouseMapData",JSON.stringify(data));
 localStorage.setItem("warehouseSpecialData",JSON.stringify(specialData));
}
function setSync(text,cls){const e=document.getElementById("syncStatus");e.textContent=text;e.className="sync "+(cls||"");}

function getFilterState(){
 return {
  status:document.getElementById("filterStatus")?.value||"all",
  street:document.getElementById("filterStreet")?.value||"all",
  side:document.getElementById("filterSide")?.value||"all",
  type:document.getElementById("filterType")?.value||"all"
 };
}

function matchesPartType(value,type){
 if(type==="all")return true;
 const text=normalizeSearchText(value);
 if(type==="other"){
  return !["капот","бампер","крыло","дверь","фара","фонарь","решетка"].some(x=>text.includes(x));
 }
 const aliases={
  "капот":["капот","hood","bonnet"],
  "бампер":["бампер","bumper"],
  "крыло":["крыло","wing"],
  "дверь":["дверь","двери","door"],
  "фара":["фара","headlight"],
  "фонарь":["фонарь","tail light","taillight"],
  "решетка":["решетка","решётка","grille"]
 };
 return (aliases[type]||[type]).some(x=>queryTokenMatchesText(x,value));
}

function cellVisible(s,l,n,v,filters){
 const filled=!!String(v||"").trim();
 if(filters.status==="filled"&&!filled)return false;
 if(filters.status==="empty"&&filled)return false;
 if(filters.street!=="all"&&filters.street!=="S"+s)return false;
 const isLeft=leftLetters.includes(l);
 if(filters.side==="left"&&!isLeft)return false;
 if(filters.side==="right"&&isLeft)return false;
 if(!matchesPartType(v,filters.type))return false;
 return true;
}

function render(){
 const map=document.getElementById("map");map.innerHTML="";
 const filters=getFilterState();

 for(let s=1;s<=5;s++){
  const street="S"+s;
  const box=document.createElement("section");
  box.className="street"+(filters.street!=="all"&&filters.street!==street?" filter-hidden":"");
  const isS1=street==="S1";
  box.innerHTML=isS1
   ? `<h2>${street}</h2><div class="sides single-side"><div class="side"><h3>Левая сторона · A–E</h3></div></div>`
   : `<h2>${street}</h2><div class="sides"><div class="side"><h3>Левая сторона · A–E</h3></div><div class="side"><h3>Правая сторона · F–K</h3></div></div>`;
  const sides=box.querySelectorAll(".side");
  leftLetters.forEach(l=>shelf(box,s,l,sides[0],filters));
  if(!isS1)rightLetters.forEach(l=>shelf(box,s,l,sides[1],filters));
  map.appendChild(box);
 }
 renderStats();
 renderSpecial();
}

function shelf(box,s,l,parent,filters){
 const sh=document.createElement("div");sh.className="shelf";
 sh.innerHTML=`<div class="shelf-title">Полка ${l}</div><div class="cells"></div>`;
 const cells=sh.querySelector(".cells");
 let visibleCount=0;

 for(let n=1;n<=10;n++){
  const v=data["S"+s][l][String(n)]||"";
  const a=address("S"+s,l,n);
  const visible=cellVisible(s,l,n,v,filters);
  if(visible)visibleCount++;

  const q=(document.getElementById("search")?.value||"").trim();
  const match=q && searchScore(searchTokens(q),`${a} ${v}`)>0;

  const c=document.createElement("button");
  c.id=`cell-${s}-${l}-${n}`;
  c.className="cell"+(v.trim()?" filled":"")+(match?" search-hit":"")+(visible?"":" filter-hidden");
  c.title=a+(v.trim()?` — ${v}`:"");
  c.innerHTML=`<b>${n}</b>`;
  c.onclick=()=>openModal("S"+s,l,String(n));
  cells.appendChild(c);
 }

 if(!visibleCount)sh.classList.add("filter-empty");
 parent.appendChild(sh);
}

function renderStats(){
 let total=0,occupied=0,items=0,empty=0;
 const typeCounts={капот:0,бампер:0,крыло:0,дверь:0,фара:0,фонарь:0,решетка:0};

 for(let s=1;s<=5;s++){

function normalizeSearchText(value){
  return String(value||"")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/й/g,"и")
    .replace(/[^a-zа-я0-9]+/g," ")
    .trim();
}

function translitToLatin(value){
  const map={
    "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y",
    "к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
    "ф":"f","х":"h","ц":"c","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e",
    "ю":"yu","я":"ya"
  };
  return normalizeSearchText(value).split("").map(ch=>map[ch]??ch).join("");
}

function fixKeyboardLayout(value){
  const ru="йцукенгшщзхъфывапролджэячсмитьбю";
  const en="qwertyuiop[]asdfghjkl;'zxcvbnm,.";
  const text=String(value||"").toLowerCase();
  return text.split("").map(ch=>{
    const i=ru.indexOf(ch);
    return i>=0 ? en[i] : ch;
  }).join("");
}

function searchTokens(value){
  return normalizeSearchText(value)
    .split(/\s+/)
    .filter(Boolean);
}

function levenshtein(a,b){
  if(a===b)return 0;
  if(!a)return b.length;
  if(!b)return a.length;
  if(a.length>b.length)[a,b]=[b,a];

  let prev=Array.from({length:a.length+1},(_,i)=>i);

  for(let j=1;j<=b.length;j++){
    const cur=[j];
    for(let i=1;i<=a.length;i++){
      cur[i]=Math.min(
        cur[i-1]+1,
        prev[i]+1,
        prev[i-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
    prev=cur;
  }
  return prev[a.length];
}

function expandSearchToken(token){
  const base=normalizeSearchText(token);
  const result=new Set([
    base,
    translitToLatin(base),
    normalizeSearchText(fixKeyboardLayout(base))
  ]);

  // Ищем совпадение в обе стороны:
  // "мазда" -> Mazda -> MZ
  // "Mazda" -> мазда -> MZ
  // "MZ" -> Mazda -> мазда
  for(const [key,aliases] of Object.entries(searchAliases)){
    const all=[key,...aliases].map(normalizeSearchText);

    if(all.includes(base)){
      all.forEach(x=>result.add(x));
    }
  }

  return [...result].filter(Boolean);
}

function addCodeMeaning(text){
  let result=String(text||"");
  const codes=result.match(/AP[A-ZА-Я]{2}\d{4}/gi)||[];

  for(const code of codes){
    const upper=code.toUpperCase();
    const brand=upper.slice(2,4).toLowerCase();
    const part=upper.slice(-1);

    if(brandCodeAliases[brand]){
      result+=" "+brandCodeAliases[brand].join(" ");
    }

    if(partCodeAliases[part]){
      result+=" "+partCodeAliases[part].join(" ");
    }
  }

  return result;
}

function queryTokenMatchesText(token,text){
  const normalized=normalizeSearchText(text);
  const textTokens=normalized.split(/\s+/).filter(Boolean);
  const compact=normalized.replace(/\s+/g,"");

  for(const variant of expandSearchToken(token)){
    if(!variant)continue;
    if(compact.includes(variant))return true;

    for(const word of textTokens){
      if(word.startsWith(variant))return true;

      if(variant.length>=3 && word.length>=3){
        const distance=levenshtein(variant,word);
        const maxDistance=variant.length<=4?1:variant.length<=7?2:3;
        if(distance<=maxDistance)return true;
      }
    }
  }

  return false;
}

function tokenIsPartType(token){
  const base=normalizeSearchText(token);
  for(const [name,aliases] of Object.entries(partTypeAliases)){
    if([name,...aliases].some(x=>normalizeSearchText(x)===base))return name;
  }
  return null;
}

function tokenIsBrand(token){
  const base=normalizeSearchText(token);

  for(const [brand,aliases] of Object.entries(searchAliases)){
    if([brand,...aliases].some(x=>normalizeSearchText(x)===base)){
      return brand;
    }
  }

  return null;
}

function codePartTypes(value){
  const result=new Set();
  const matches=String(value||"").toUpperCase().match(/\bAP[A-Z]{2}\d+\b/g)||[];

  for(const code of matches){
    const last=code.slice(-1);
    (partCodeTypes[last]||[]).forEach(x=>result.add(normalizeSearchText(x)));
  }

  return result;
}

function brandMatchesValue(brand,value){
  const text=normalizeSearchText(value);
  const variants=expandSearchToken(brand);

  if(variants.some(v=>v && text.replace(/\s+/g,"").includes(v.replace(/\s+/g,"")))){
    return true;
  }

  // Артикул склада: AP + код марки, например APMZ1606.
  const brandAliases=(searchAliases[brand]||[brand]).map(normalizeSearchText);
  return brandAliases.some(alias=>{
    const compact=alias.replace(/\s+/g,"");
    return compact.length<=4 && new RegExp("AP"+compact+"\\d+","i").test(String(value||""));
  });
}

function partMatchesValue(part,value){
  const types=codePartTypes(value);

  if(types.size){
    const aliases=partTypeAliases[part]||[part];
    return aliases.some(x=>types.has(normalizeSearchText(x)));
  }

  const aliases=partTypeAliases[part]||[part];
  return aliases.some(x=>queryTokenMatchesText(x,value));
}

function parseExcelLocations(value){
  const result=[];
  const text=String(value||"").toUpperCase();

  // 1С может писать:
  // S5, A3
  // S5, A2, A3
  // (S5, A3) (S4, F3)
  // S4, F6,F7,F8
  //
  // Ищем каждую улицу S1-S5, а затем все пары
  // "буква полки + номер" до следующей улицы.
  const streetRe=/S\s*([1-5])/gi;
  const streets=[...text.matchAll(streetRe)];

  for(let i=0;i<streets.length;i++){
    const street=Number(streets[i][1]);
    const from=streets[i].index+streets[i][0].length;
    const to=i+1<streets.length ? streets[i+1].index : text.length;
    const part=text.slice(from,to);

    const shelfRe=/([A-EFGHJK])\s*(?:[-–—])?\s*([0-9]{1,2})/gi;

    for(const match of part.matchAll(shelfRe)){
      const letter=match[1].toUpperCase();
      const num=Number(match[2]);

      if(num<1 || num>10)continue;

      // На S1 у текущей карты есть только левая сторона A-E.
      if(street===1 && !leftLetters.includes(letter))continue;

      if(street>=2 && street<=5 && !letters.includes(letter))continue;

      result.push(`S${street}-${letter}-${num}`);
    }
  }

  return [...new Set(result)];
}

function excelCellText(value){
  if(value===null || value===undefined)return "";
  return String(value).trim();
}

function findExcelColumns(row,columnMap){
  const cells=(row||[]).map(excelCellText);

  const descIndex=columnMap?.description ?? (cells.length===3 ? 0 : 1);
  const articleIndex=columnMap?.article ?? (cells.length===3 ? 1 : 2);
  const locationIndex=columnMap?.location ?? (cells.length===3 ? 2 : 3);

  return {
    description: cells[descIndex]||"",
    article: cells[articleIndex]||"",
    location: cells[locationIndex]||""
  };
}

async function importExcelFile(file){
  if(!file)return;

  if(typeof XLSX==="undefined"){
    alert("Не удалось загрузить модуль Excel. Обнови страницу и попробуй ещё раз.");
    return;
  }

  try{
    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:"array",cellDates:false});
    const sheet=workbook.Sheets[workbook.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false});

    if(!rows.length){
      alert("Excel пустой.");
      return;
    }

    // Определяем колонки по заголовкам. Текущий Excel из 1С:
    // A = Описание, B = Артикул, C = Ячейка.
    const headers=(rows[0]||[]).map(v=>String(v||"").trim().toLowerCase());

    const columnMap={
      description: headers.findIndex(h =>
        /описан|наимен|назван/.test(h)
      ),
      article: headers.findIndex(h =>
        /артикул|код/.test(h)
      ),
      location: headers.findIndex(h =>
        /ячейк|адрес|место.*хран|хранен/.test(h)
      )
    };

    // Если заголовки не распознаны, используем стандартный формат:
    // 3 колонки -> A/B/C, 4+ колонок -> B/C/D.
    if(columnMap.description<0)
      columnMap.description=(rows[0]||[]).length===3 ? 0 : 1;
    if(columnMap.article<0)
      columnMap.article=(rows[0]||[]).length===3 ? 1 : 2;
    if(columnMap.location<0)
      columnMap.location=(rows[0]||[]).length===3 ? 2 : 3;

    const imported={};
    const skipped=[];
    let rowCount=0;
    let locationCount=0;

    for(let i=1;i<rows.length;i++){
      const row=rows[i]||[];
      const {description,article,location}=findExcelColumns(row,columnMap);

      if(!description && !article && !location)continue;
      rowCount++;

      if(!article){
        skipped.push({row:i+1,reason:"не найден артикул"});
        continue;
      }

      if(!location){
        skipped.push({row:i+1,reason:"нет адреса хранения"});
        continue;
      }

      const locations=parseExcelLocations(location);

      if(!locations.length){
        // Например строка "S4" означает только улицу,
        // но не конкретную ячейку. Её нельзя безопасно
        // положить в карту автоматически.
        skipped.push({
          row:i+1,
          reason:`нет конкретной ячейки: ${location}`
        });
        continue;
      }

      const content=description
        ? `${article} — ${description}`
        : article;

      for(const addr of locations){
        if(!imported[addr])imported[addr]=[];

        if(!imported[addr].includes(content)){
          imported[addr].push(content);
          locationCount++;
        }
      }
    }

    const addresses=Object.keys(imported);

    if(!addresses.length){
      alert(
        `Excel прочитан, но конкретных ячеек не найдено.\\n\\n`+
        `Строк с данными: ${rowCount}\\n`+
        `Пример ожидаемого адреса: S5, A3 или S4, F6,F7,F8.`
      );
      return;
    }

    const preview=addresses.slice(0,10).map(addr=>{
      return `${addr}\\n${imported[addr].join("\\n")}`;
    }).join("\\n\\n");

    const more=addresses.length>10
      ? `\\n\\n…и ещё ${addresses.length-10} ячеек.`
      : "";

    const skippedPreview=skipped.slice(0,5).map(x=>{
      return `строка ${x.row}: ${x.reason}`;
    }).join("\\n");

    const skippedMore=skipped.length>5
      ? `\\n…и ещё ${skipped.length-5}.`
      : "";

    const ok=confirm(
      `Excel: ${file.name}\\n\\n`+
      `Строк с данными: ${rowCount}\\n`+
      `Ячеек для заполнения: ${addresses.length}\\n`+
      `Записей: ${locationCount}\\n`+
      `Пропущено строк: ${skipped.length}\\n\\n`+
      `Пример:\\n${preview}${more}`+
      (skipped.length
        ? `\\n\\nПропущенные строки:\\n${skippedPreview}${skippedMore}`
        : "")+
      `\\n\\nЗагрузить эти данные на карту?`
    );

    if(!ok)return;

    // Формируем только те ячейки, которые пришли из Excel.
    // Используем частичное обновление Firebase, чтобы импорт:
    // 1) не перезаписывал весь склад;
    // 2) не удалял существующие ячейки;
    // 3) не зависел от размера всего объекта data.
    const patch={};
    const validAddresses=[];

    for(const addr of addresses){
      const match=addr.match(/^S([1-5])-([A-K])-(\d+)$/);
      if(!match)continue;

      const [,s,l,n]=match;
      const value=imported[addr].join("\n");

      if(!data[`S${s}`] || !data[`S${s}`][l]){
        continue;
      }

      if(!data[`S${s}`][l][n] && value){
        // просто для читаемости; значение всё равно будет записано ниже
      }

      patch[`S${s}/${l}/${n}`]=value;
      validAddresses.push(addr);
    }

    if(!validAddresses.length){
      alert("Excel распознан, но ни одного адреса карты не удалось подготовить к записи.");
      return;
    }

    try{
      // Сначала записываем в Firebase.
      // Если Firebase отклонит запись, данные на карте не меняем.
      await rootRef.child("cells").update(patch);

      // После успешной записи обновляем локальное состояние.
      for(const addr of validAddresses){
        const match=addr.match(/^S([1-5])-([A-K])-(\d+)$/);
        const [,s,l,n]=match;
        data[`S${s}`][l][n]=imported[addr].join("\n");
      }

      setLocal();
      render();
      doSearch();

      setSync(`☁️ Excel загружен: ${validAddresses.length} ячеек`,"ok");

      alert(
        `Готово!\\n\\n`+
        `Загружено ячеек: ${validAddresses.length}\\n`+
        `Записей: ${locationCount}\\n`+
        (skipped.length
          ? `Пропущено строк: ${skipped.length}`
          : "Все строки с адресами обработаны.")
      );

    }catch(e){
      console.error("Excel import Firebase error:",e);

      setSync(
        `⚠️ Ошибка загрузки Excel: ${e?.code||"Firebase"}`,
        "err"
      );

      alert(
        `Excel распознан, но Firebase не разрешил записать данные.\\n\\n`+
        `Ошибка: ${e?.code||e?.message||e}\\n\\n`+
        `Если здесь написано PERMISSION_DENIED — проверь права записи для твоего Google-аккаунта.`
      );

      return;
    }


    if(skipped.length){
      console.warn("Пропущенные строки Excel:",skipped);
    }

  }catch(err){
    console.error(err);
    alert("Ошибка чтения Excel: "+(err?.message||err));
  }
}

function normalizeForSearch(value){
  return String(value||"")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/й/g,"и")
    .trim();
}

function fuzzyTokenMatch(query,text){
  const q=normalizeForSearch(query).replace(/[^a-zа-я0-9]/g,"");
  const t=normalizeForSearch(text);
  const words=t.split(/[^a-zа-я0-9]+/).filter(Boolean);
  if(!q)return true;

  // Сначала строгое совпадение/вхождение.
  if(words.some(w=>w.includes(q)||q.includes(w)))return true;

  // Затем небольшие опечатки. Для коротких слов порог специально маленький,
  // чтобы «капот» не начинал совпадать с «бампер».
  if(q.length>=4){
    return words.some(w=>{
      const d=levenshtein(q,w);
      const max=q.length<=5?1:q.length<=8?2:3;
      return d<=max;
    });
  }
  return false;
}

function explicitPartTypes(text){
  const t=normalizeForSearch(text);
  const found=new Set();

  // Важное правило: если в содержимом ячейки прямо написано «капот»,
  // «бампер» и т.п., используем именно эту надпись, а не предполагаемый
  // тип по последней цифре артикула.
  if(/\bкапот\b|\bhood\b|\bbonnet\b/.test(t))found.add("капот");
  if(/\bбампер\b|\bbumper\b|\bfront bumper\b|\brear bumper\b/.test(t))found.add("бампер");
  if(/\bкрыло\b|\bwing\b/.test(t))found.add("крыло");
  if(/\bдверь\b|\bдвери\b|\bdoor\b/.test(t))found.add("дверь");
  if(/\bфара\b|\bheadlight\b/.test(t))found.add("фара");
  if(/\bфонарь\b|\bфонар\b|\btail light\b|\btaillight\b/.test(t))found.add("фонарь");
  if(/\bрешетка\b|\bрешётка\b|\bgrille\b/.test(t))found.add("решетка");

  return found;
}

function directPartMatch(part,text){
  const aliases=partTypeAliases[part]||[part];
  return aliases.some(alias=>fuzzyTokenMatch(alias,text));
}

function searchPartMatch(part,text){
  // 1. Если тип детали явно написан в ячейке — доверяем именно надписи.
  const explicit=explicitPartTypes(text);
  if(explicit.size)return explicit.has(part);

  // 2. Если явной надписи нет, можно использовать код артикула как запасной
  //    источник информации о типе.
  const types=codePartTypes(text);
  if(types.size){
    const aliases=partTypeAliases[part]||[part];
    return aliases.some(x=>types.has(normalizeSearchText(x)));
  }

  // 3. И наконец обычный поиск по всему содержимому ячейки.
  return directPartMatch(part,text);
}

function searchBrandMatch(brand,text){
  // Для марки автомобиля используем строгое совпадение.
  // Нечёткий поиск коротких кодов вроде MZ давал ложные результаты.
  const normalized=normalizeSearchText(text);
  const aliases=(searchAliases[brand]||[brand]).map(normalizeSearchText);

  // Название марки должно реально присутствовать в содержимом ячейки.
  for(const alias of aliases){
    if(alias.length>=4 && normalized.includes(alias))return true;
  }

  // Короткий код марки разрешён только внутри складского артикула AP+код.
  const brandCodes={
    "мазда":"MZ","хонда":"HD","тойота":"TY","ниссан":"NS",
    "форд":"FD","ауди":"AU","бмв":"BM","фольксваген":"VW",
    "шевроле":"CH","мерседес":"MB","лексус":"LX","инфинити":"INF",
    "акура":"AC","субару":"SU","митсубиси":"MI","сузуки":"SZ",
    "исузу":"IZ","дайхатсу":"DH","киа":"KI","хендай":"HY",
    "генезис":"GN","дэу":"DW","рено":"RE","пежо":"PG",
    "ситроен":"CT","фиат":"FT","вольво":"VO","сааб":"SA",
    "ягуар":"JG","ланд ровер":"LR","ровер":"RV","джип":"JP",
    "додж":"DG","крайслер":"CH","кадиллак":"CA","линкольн":"LN",
    "бьюик":"BK","понтиак":"PT","саат":"ST","шкода":"SK",
    "опель":"OP","порше":"PR","бентли":"BE","масерати":"MA",
    "ламборгини":"LM","феррари":"FR","тесла":"TS","мини":"MN",
    "мг":"MG","лада":"LA","ваз":"VA","газ":"GA","уаз":"UA"
  };

  const code=brandCodes[brand];
  if(code){
    const raw=String(text||"").toUpperCase();
    if(new RegExp("(?:^|[^A-ZА-Я0-9])AP"+code+"[A-ZА-Я0-9-]*", "i").test(raw))return true;
  }

  return false;
}

function searchScore(queryTokens,text){
  if(!queryTokens.length)return 0;
  let score=0;

  // Все слова запроса работают как AND:
  // «Mazda капот» = Mazda И капот должны относиться к одной ячейке.
  for(const rawToken of queryTokens){
    const brand=tokenIsBrand(rawToken);
    const part=tokenIsPartType(rawToken);

    if(part){
      if(!searchPartMatch(part,text))return 0;
      score+=150;
      continue;
    }

    if(brand){
      if(!searchBrandMatch(brand,text))return 0;
      score+=140;
      continue;
    }

    if(!queryTokenMatchesText(rawToken,text))return 0;
    score+=80;
  }

  return score;
}

function formatSearchPreview(value){
 const lines=String(value||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
 if(!lines.length)return `<span class="search-empty">Ячейка пустая</span>`;
 return lines.map(line=>{
  // Наш формат хранения: АРТИКУЛ — ОПИСАНИЕ.
  const m=line.match(/^(.+?)\s+—\s+(.+)$/);
  if(m){
   return `<div class="search-item"><b>${esc(m[1])}</b><span>${esc(m[2])}</span></div>`;
  }
  return `<div class="search-item"><b>${esc(line)}</b></div>`;
 }).join("");
}

function doSearch(){
 const raw=document.getElementById("search").value.trim();
 const out=document.getElementById("results");

 if(!raw){
  out.innerHTML="";
  render();
  return;
 }

 const tokens=searchTokens(raw);
 const found=[];

 // Ищем по всему складу, независимо от выбранных фильтров.
 // Это позволяет сначала найти деталь, а потом уже отфильтровать карту.
 for(let s=1;s<=5;s++){
  const ls=s===1?leftLetters:[...leftLetters,...rightLetters];
  for(const l of ls){
   for(let n=1;n<=10;n++){
    const v=String(data["S"+s][l][String(n)]||"").trim();
    if(!v)continue;

    const a=address("S"+s,l,n);
    const searchable=`${a} ${v}`;
    const score=searchScore(tokens,searchable);

    if(score>0){
     found.push({a,v,s:"S"+s,l,n:String(n),score});
    }
   }
  }
 }

 for(const type of ["resale","defect"]){
  const v=String(specialData[type]||"").trim();
  if(!v)continue;
  const a=type==="resale"?"Перекупной товар":"Брак";
  const score=searchScore(tokens,`${a} ${v}`);
  if(score>0)found.push({a,v,special:type,score});
 }

 found.sort((a,b)=>b.score-a.score || a.a.localeCompare(b.a,"ru"));

 if(!found.length){
  out.innerHTML=`<div class="search-head">По запросу «${esc(raw)}» ничего не найдено.</div>`;
  render();
  return;
 }

 out.innerHTML=
  `<div class="search-head">🔎 По запросу «${esc(raw)}» найдено ячеек: <b>${found.length}</b></div>`+
  found.map(x=>x.special
   ? `<div class="result search-result special-result" onclick="openSpecial('${x.special}')">
       <div class="result-address">${esc(x.a)}</div>
       <div class="result-content">${formatSearchPreview(x.v)}</div>
     </div>`
   : `<div class="result search-result" onclick="scrollToCell('${x.s}','${x.l}','${x.n}')">
       <div class="result-address">${esc(x.a)}</div>
       <div class="result-content">${formatSearchPreview(x.v)}</div>
       <button class="copy-btn" title="Скопировать адрес" onclick="event.stopPropagation();copyText('${x.a}')">📋</button>
     </div>`
  ).join("");

 render();
}

// Поиск должен обновляться сразу при вводе, а не только после сохранения ячейки.
document.getElementById("search").addEventListener("input",doSearch);

function scrollToCell(s,l,n){
 render();
 const el=document.getElementById(`cell-${s}-${l}-${n}`);
 if(!el)return;
 el.scrollIntoView({behavior:"smooth",block:"center",inline:"center"});
 el.classList.remove("focused");
 void el.offsetWidth;
 el.classList.add("focused");
}

async function copyText(value){
 try{
  await navigator.clipboard.writeText(String(value));
  setSync(`📋 Скопировано: ${value}`,"ok");
 }catch(e){
  const ta=document.createElement("textarea");
  ta.value=value;document.body.appendChild(ta);ta.select();
  document.execCommand("copy");ta.remove();
  setSync(`📋 Скопировано: ${value}`,"ok");
 }
}

function exportExcel(){
 if(typeof XLSX==="undefined"){
  alert("Модуль Excel ещё не загрузился. Обнови страницу и попробуй снова.");
  return;
 }

 const rows=[["Ячейка","Артикул","Описание"]];

 for(let s=1;s<=5;s++){
  const ls=s===1?leftLetters:[...leftLetters,...rightLetters];
  for(const l of ls){
   for(let n=1;n<=10;n++){
    const v=String(data["S"+s][l][String(n)]||"").trim();
    if(!v)continue;

    const lines=v.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    if(!lines.length)continue;

    for(const line of lines){
     const m=line.match(/^(.+?)\s*[—-]\s*(.*)$/);
     if(m)rows.push([address("S"+s,l,n),m[1].trim(),m[2].trim()]);
     else rows.push([address("S"+s,l,n),line,""]);
    }
   }
  }
 }

 const ws=XLSX.utils.aoa_to_sheet(rows);
 ws["!cols"]=[{wch:14},{wch:28},{wch:70}];
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,"Склад");

 const date=new Date().toISOString().slice(0,10);
 XLSX.writeFile(wb,`склад_${date}.xlsx`);
 setSync("📤 Excel выгружен","ok");
}

async function showHistory(){
 const modal=document.getElementById("historyModal");
 const list=document.getElementById("historyList");
 modal.style.display="flex";
 list.innerHTML="Загрузка…";

 try{
  const snap=await rootRef.child("history").orderByChild("timestamp").limitToLast(100).once("value");
  const values=snap.val()||{};
  const items=Object.values(values).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));

  if(!items.length){
   list.innerHTML="<div>История пока пустая.</div>";
   return;
  }

  list.innerHTML=items.map(x=>{
   const date=x.timestamp?new Date(x.timestamp).toLocaleString("ru-RU"):"—";
   const oldV=x.oldValue?esc(x.oldValue):"<em>пусто</em>";
   const newV=x.newValue?esc(x.newValue):"<em>пусто</em>";
   return `<div class="history-item">
    <b>${esc(x.address||"")}</b> — ${esc(x.email||"")}
    <br><small>${date}</small>
    <br>${oldV} → <b>${newV}</b>
   </div>`;
  }).join("");
 }catch(e){
  console.error(e);
  list.innerHTML=`<div class="sync err">Не удалось загрузить историю: ${esc(e?.message||e)}</div>`;
 }
}
function closeHistory(){document.getElementById("historyModal").style.display="none";}
