<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивная карта склада</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#18212b;--muted:#66717d;--accent:#1f6feb;--empty:#e8edf2;--filled:#7ccf8a;--border:#c8d0d8;--search:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#17212b;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}
h1{margin:0 0 8px;font-size:24px}.sub{font-size:13px;color:#cbd5df}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
input,button{font:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:#fff}
button{cursor:pointer;font-weight:600}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:12px;max-width:1500px;width:100%;margin:auto;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--border)}
.sync{font-weight:700}.sync.ok{color:#2e6b3b}.sync.warn{color:#9a6500}.sync.err{color:#b42318}
.map{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px}
.street{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 2px 7px #0000000b;min-width:0}
.street h2{margin:0 0 10px;text-align:center;background:#17212b;color:white;border-radius:9px;padding:8px;font-size:18px}
.sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.sides.single-side{grid-template-columns:1fr}
.side{min-width:0}.side h3{font-size:13px;text-align:center;margin:5px 0 7px;color:var(--muted)}
.shelf{border:1px solid #9eaab5;border-radius:8px;overflow:hidden;margin-bottom:9px;background:#fafbfc}
.shelf-title{padding:5px 7px;background:#f0f3f6;font-weight:700;text-align:center;font-size:13px;color:#000}
.cells{display:grid;grid-template-columns:repeat(5,32px);gap:5px;padding:6px;justify-content:center}
.cell{width:32px;height:30px;min-height:30px;border:1px solid #b9c2ca;border-radius:6px;background:var(--empty);font-size:11px;padding:0;cursor:pointer;text-align:center}
.cell:hover{outline:2px solid var(--accent);outline-offset:1px;z-index:1}.cell.filled{background:var(--filled);font-weight:700}
.cell.search-hit{background:var(--search)!important;color:#fff!important;border-color:#b91c1c;box-shadow:0 0 0 2px #ef444466,0 2px 8px #ef444466}
.stats{margin:10px 0;color:var(--muted);font-size:13px}
#modal,#specialModal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#specialModal{z-index:30}.dialog{background:white;border-radius:14px;width:min(520px,100%);padding:18px;box-shadow:0 10px 40px #0005}
.dialog h2{margin-top:0}.addr{font-family:monospace;color:var(--accent);font-weight:700}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}
textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:10px;font:inherit}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.result{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin:7px 0;cursor:pointer}
.result strong{display:block;color:#1264d8;font-size:14px}
.result .article{display:block;margin-top:5px;color:#222;font-size:13px;font-weight:700}
 .result:hover{border-color:var(--accent)}
.special-storage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px auto;max-width:1500px;padding:0 12px}
.special-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 2px 7px #0000000b;min-width:0}
.special-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:54px;padding:9px;border:1px solid #b9c2ca;border-radius:8px;background:#f5f7f9;color:#25313d;cursor:pointer;font:inherit}
.special-cell:hover{background:#eaf0f5;border-color:#8d9aa7;box-shadow:0 2px 7px #00000012}.special-cell:active{transform:scale(.985)}
.special-cell strong{font-size:13px}.special-cell small{max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#53606c;font-weight:400}
.special-cell.filled{background:var(--filled);border-color:#9bbba3}.special-cell.filled strong{color:#2e5b39}
@media(min-width:1100px){
 main{padding:14px 18px}.map{grid-template-columns:minmax(125px,1fr) repeat(4,minmax(235px,2fr));gap:8px}
 .street{padding:7px}.street h2{font-size:15px;padding:6px}.sides{gap:6px}.side h3{font-size:9px}
 .shelf-title{font-size:9px;padding:3px}.cells{grid-template-columns:repeat(5,22px);gap:3px;padding:5px}
 .cell{width:22px;min-width:22px;height:23px;min-height:23px;font-size:9px}
}
@media(max-width:1099px){.map{grid-template-columns:1fr}.street{width:100%}.sides{gap:8px}.cells{grid-template-columns:repeat(5,30px);gap:5px}.cell{width:30px;min-width:30px;height:29px;min-height:29px;font-size:10px}.side h3{font-size:10px}.shelf-title{font-size:10px}}
@media(max-width:520px){main{padding:8px}.map{gap:8px}.street{padding:6px}.sides{gap:5px}.cells{grid-template-columns:repeat(5,27px);gap:4px;padding:5px}.cell{width:27px;min-width:27px;height:27px;min-height:27px}.special-storage{grid-template-columns:1fr;gap:8px;padding:0 8px}.special-cell{min-height:52px}}
#loginScreen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}

#loginBox{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:30px;
  width:360px;
  max-width:90%;
  text-align:center;
  box-shadow:0 10px 40px #000;
}

#loginBox h2{
  margin-top:0;
}

#loginBox p{
  color:var(--muted);
  margin-bottom:20px;
}
.dialog select,.dialog input[type="text"]{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #b8c4d0;border-radius:8px;font-size:16px;background:#fff}
#moveModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:10000}
#moveModal .dialog{max-width:520px;width:calc(100% - 32px)}
</style>
</head>
<body>

<div id="loginScreen" style="
  position:fixed;
  inset:0;
  z-index:9999;
  background:#121212;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:Arial,sans-serif;
">
  <div style="
    background:#1e1e1e;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    max-width:360px;
    width:calc(100% - 40px);
  ">
    <h2 style="margin-top:0;color:#fff;">🔐 Доступ к складу</h2>

    <p style="color:#aaa;margin-bottom:25px;">
      Войдите через Google, чтобы открыть карту склада.
    </p>

    <button onclick="loginWithGoogle()" style="
      width:100%;
      padding:12px 18px;
      border:0;
      border-radius:10px;
      background:#fff;
      color:#222;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    ">
      Войти через Google
    </button>

    <div id="loginError" style="
      color:#ff6b6b;
      margin-top:15px;
      font-size:13px;
      display:none;
    "></div>
  </div>
</div>

<header>
<h1>📦 Интерактивная карта склада</h1>
<div class="sub">Адрес: улица (S1–S5) → полка (A–E слева / F–K справа)</div>
<div class="toolbar">
<input id="search" type="search" placeholder="🔎 Поиск детали, артикула или адреса…" style="width:100%;min-width:0">
<button class="primary" onclick="document.getElementById('excelFile').click()">📥 Загрузить Excel</button>
<button onclick="temporaryClearWarehouse()" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5">🗑️ Очистить склад</button>
<input id="excelFile" type="file" accept=".xlsx,.xls" style="display:none">
</div>
</header>
<main>
<div class="legend">
<span><i class="dot" style="background:var(--empty)"></i>пустая</span>
<span><i class="dot" style="background:var(--filled)"></i>занята</span>
<span>Нажми на ячейку — откроется карточка хранения.</span>
<span id="syncStatus" class="sync warn">☁️ Подключение к Firebase…</span>
</div>
<div id="results"></div>
<div id="stats" class="stats"></div>
<div id="map" class="map"></div>
</main>

<div class="special-storage">
<section class="special-box"><button class="special-cell" id="resaleCell" onclick="openSpecial('resale')"><strong>Перекупной товар</strong><small id="resalePreview"></small></button></section>
<section class="special-box"><button class="special-cell" id="defectCell" onclick="openSpecial('defect')"><strong>Брак</strong><small id="defectPreview"></small></button></section>
</div>

<div id="specialModal"><div class="dialog">
<h2 id="specialTitle"></h2><label>Что находится здесь</label>
<textarea id="specialContent" placeholder="Например: APHD4307 — 1 шт.&#10;Можно указать несколько артикулов."></textarea>
<div class="actions"><button onclick="closeSpecial()">Отмена</button><button class="primary" onclick="saveSpecial()">Сохранить</button></div>
</div></div>

<div id="modal"><div class="dialog">
<h2>Ячейка <span id="addr" class="addr"></span></h2><label>Что лежит в ячейке</label>
<textarea id="content" placeholder="Например: APHD4307 — капот Honda, 2 шт.&#10;Можно указать несколько позиций."></textarea>
<div class="actions">
<button onclick="closeModal()">Отмена</button>
<button onclick="openMoveModal()">📦 Переместить деталь</button>
<button class="primary" onclick="saveCell()">Сохранить</button>
</div>
</div></div>

<div id="moveModal"><div class="dialog">
<h2>📦 Переместить деталь</h2>
<label>Что перемещаем</label>
<select id="moveItem"></select>
<label style="display:block;margin-top:12px">Новая ячейка</label>
<input id="moveDestination" type="text" placeholder="Например: S4-F-7">
<div id="moveError" style="display:none;color:#b91c1c;margin-top:10px"></div>
<div class="actions">
<button onclick="closeMoveModal()">Отмена</button>
<button class="primary" onclick="moveSelectedDetail()">Переместить</button>
</div>
</div></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyAFd_IPlACJlpxeGsNE7Iq3dQm-VYu5Ba4",
    authDomain: "warehouse-map-b6ed6.firebaseapp.com",
    databaseURL: "https://warehouse-map-b6ed6-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "warehouse-map-b6ed6",
    storageBucket: "warehouse-map-b6ed6.firebasestorage.app",
    messagingSenderId: "196261680344",
    appId: "1:196261680344:web:fdd54671cf57690744f3ad",
    measurementId: "G-7GZFEYSDSJ"
};

firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

const db=firebase.database();
 
const rootRef=db.ref("warehouse");
 function loginWithGoogle(){
  auth.signInWithPopup(provider)
    .catch(error => {
      const el = document.getElementById("loginError");
      el.textContent = "Ошибка входа: " + error.message;
      el.style.display = "block";
    });
}

auth.onAuthStateChanged(user => {
  const loginScreen = document.getElementById("loginScreen");

  if (user) {
    loginScreen.style.display = "none";
  } else {
    loginScreen.style.display = "flex";
  }
});

const letters=["A","B","C","D","E","F","G","H","J","K"];
const leftLetters=["A","B","C","D","E"];
const rightLetters=["F","G","H","J","K"];
let data=createEmptyData(), specialData={resale:"",defect:""}, current=null, currentSpecial=null;
let remoteLoaded=false;

function createEmptyData(){
 const d={};
 for(let s=1;s<=5;s++){d["S"+s]={};for(const l of letters){d["S"+s][l]={};for(let n=1;n<=10;n++)d["S"+s][l][String(n)]="";}}
 return d;
}
function address(s,l,n){return `${s}-${l}-${n}`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function hasLocalData(){
 const d=JSON.parse(localStorage.getItem("warehouseMapData")||"null");
 const sp=JSON.parse(localStorage.getItem("warehouseSpecialData")||"null");
 return !!(d && Object.values(d).some(st=>Object.values(st).some(sh=>Object.values(sh).some(v=>String(v||"").trim())))) ||
        !!(sp && Object.values(sp).some(v=>String(v||"").trim()));
}
function normalizeData(d){
 const out=createEmptyData();
 if(!d)return out;
 for(let s=1;s<=5;s++)for(const l of letters)for(let n=1;n<=10;n++){
  out["S"+s][l][String(n)]=d?.["S"+s]?.[l]?.[String(n)]||"";
 }
 return out;
}
function setLocal(){
 localStorage.setItem("warehouseMapData",JSON.stringify(data));
 localStorage.setItem("warehouseSpecialData",JSON.stringify(specialData));
}
function setSync(text,cls){const e=document.getElementById("syncStatus");e.textContent=text;e.className="sync "+(cls||"");}

function render(){
 const map=document.getElementById("map");map.innerHTML="";
 let visibleOccupied=0;
 for(let s=1;s<=5;s++){
  const street="S"+s,box=document.createElement("section");box.className="street";
  const isS1=street==="S1";
  box.innerHTML=isS1
   ? `<h2>${street}</h2><div class="sides single-side"><div class="side"><h3>Левая сторона · A–E</h3></div></div>`
   : `<h2>${street}</h2><div class="sides"><div class="side"><h3>Левая сторона · A–E</h3></div><div class="side"><h3>Правая сторона · F–K</h3></div></div>`;
  const sides=box.querySelectorAll(".side");
  leftLetters.forEach(l=>{visibleOccupied+=shelf(box,s,l,sides[0]);});
  if(!isS1)rightLetters.forEach(l=>{visibleOccupied+=shelf(box,s,l,sides[1]);});
  map.appendChild(box);
 }
 document.getElementById("stats").textContent=`Занято: ${visibleOccupied} из 450 ячеек`;
 renderSpecial();
}
function shelf(box,s,l,parent){
 const sh=document.createElement("div");sh.className="shelf";
 sh.innerHTML=`<div class="shelf-title">Полка ${l}</div><div class="cells"></div>`;
 const cells=sh.querySelector(".cells"),q=(document.getElementById("search")?.value||"").trim().toLowerCase();
 let occupied=0;
 for(let n=1;n<=10;n++){
  const val=data["S"+s][l][String(n)]||"",a=address("S"+s,l,n);
  if(val.trim())occupied++;
  const match=q&&(a.toLowerCase().includes(q)||val.toLowerCase().includes(q));
  const c=document.createElement("button");
  c.className="cell"+(val.trim()?" filled":"")+(match?" search-hit":"");
  c.title=a+(val.trim()?` — ${val}`:"");c.innerHTML=`<b>${n}</b>`;
  c.onclick=()=>openModal("S"+s,l,String(n));cells.appendChild(c);
 }
 parent.appendChild(sh);return occupied;
}
function openModal(s,l,n){
 current={s,l,n};document.getElementById("addr").textContent=address(s,l,n);
 document.getElementById("content").value=data[s][l][n]||"";
 document.getElementById("modal").style.display="flex";
 setTimeout(()=>document.getElementById("content").focus(),50);
}
function closeModal(){document.getElementById("modal").style.display="none";current=null}
function openMoveModal(){
  if(!current)return;

  const value=String(data[current.s][current.l][current.n]||"").trim();
  const lines=value.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);
  const select=document.getElementById("moveItem");
  const error=document.getElementById("moveError");
  error.style.display="none";
  error.textContent="";

  select.innerHTML="";
  if(!lines.length){
    const opt=document.createElement("option");
    opt.textContent="В этой ячейке нет деталей";
    opt.value="";
    select.appendChild(opt);
  }else{
    lines.forEach((line,i)=>{
      const opt=document.createElement("option");
      opt.value=String(i);
      opt.textContent=line;
      select.appendChild(opt);
    });
  }

  document.getElementById("moveDestination").value="";
  document.getElementById("moveModal").style.display="flex";
  setTimeout(()=>document.getElementById("moveDestination").focus(),50);
}

function closeMoveModal(){
  document.getElementById("moveModal").style.display="none";
}

async function moveSelectedDetail(){
  if(!current)return;

  const value=String(data[current.s][current.l][current.n]||"").trim();
  const lines=value.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);
  const index=Number(document.getElementById("moveItem").value);
  const destinationRaw=document.getElementById("moveDestination").value.trim();
  const error=document.getElementById("moveError");

  error.style.display="none";
  error.textContent="";

  if(!lines.length || !Number.isInteger(index) || !lines[index]){
    error.textContent="В этой ячейке нет детали для перемещения.";
    error.style.display="block";
    return;
  }

  const parsed=parseExcelLocations(destinationRaw);
  if(parsed.length!==1){
    error.textContent="Укажи одну конкретную ячейку, например S4-F-7.";
    error.style.display="block";
    return;
  }

  const dest=parsed[0];
  const sourceAddress=address(current.s,current.l,current.n);
  const destAddress=address(dest.s,dest.l,dest.n);

  if(sourceAddress===destAddress){
    error.textContent="Новая ячейка совпадает с текущей.";
    error.style.display="block";
    return;
  }

  const detail=lines[index];
  const destValue=String(data[dest.s][dest.l][String(dest.n)]||"").trim();
  const newSourceLines=lines.filter((_,i)=>i!==index);
  const newSourceValue=newSourceLines.join("\n");
  const newDestValue=destValue ? destValue+"\n"+detail : detail;

  try{
    // Сначала меняем Firebase. Если запись не прошла, локальные данные не трогаем.
    const updates={};
    updates["cells/"+current.s+"/"+current.l+"/"+current.n]=newSourceValue;
    updates["cells/"+dest.s+"/"+dest.l+"/"+dest.n]=newDestValue;
    await rootRef.update(updates);

    data[current.s][current.l][current.n]=newSourceValue;
    data[dest.s][dest.l][String(dest.n)]=newDestValue;
    setLocal();
    render();
    doSearch();
    setSync("📦 Деталь перемещена","ok");

    closeMoveModal();
    closeModal();

    alert("Готово!\n\n"+detail+"\n\n"+sourceAddress+" → "+destAddress);
  }catch(e){
    console.error("Ошибка перемещения:",e);
    error.textContent="Не удалось сохранить перемещение в Firebase.";
    error.style.display="block";
    setSync("⚠️ Ошибка синхронизации","err");
  }
}

async function saveCell(){
 if(!current)return;
 const value=document.getElementById("content").value.trim();
 data[current.s][current.l][current.n]=value;setLocal();render();doSearch();
 try{await rootRef.child("cells").child(current.s).child(current.l).child(current.n).set(value);setSync("☁️ Синхронизировано","ok");}
 catch(e){setSync("⚠️ Ошибка синхронизации","err");console.error(e)}
 closeModal();
}

function openSpecial(type){
 currentSpecial=type;document.getElementById("specialTitle").textContent=type==="resale"?"Перекупной товар":"Брак";
 document.getElementById("specialContent").value=specialData[type]||"";
 document.getElementById("specialModal").style.display="flex";
 setTimeout(()=>document.getElementById("specialContent").focus(),50);
}
function closeSpecial(){document.getElementById("specialModal").style.display="none";currentSpecial=null}
async function saveSpecial(){
 if(!currentSpecial)return;
 const value=document.getElementById("specialContent").value.trim();specialData[currentSpecial]=value;setLocal();renderSpecial();doSearch();
 try{await rootRef.child("special").child(currentSpecial).set(value);setSync("☁️ Синхронизировано","ok");}
 catch(e){setSync("⚠️ Ошибка синхронизации","err");console.error(e)}
 closeSpecial();
}
function renderSpecial(){
 for(const [type,id,preview] of [["resale","resaleCell","resalePreview"],["defect","defectCell","defectPreview"]]){
  const v=specialData[type]||"";document.getElementById(id).classList.toggle("filled",!!v);document.getElementById(preview).textContent=v;
 }
}
async function temporaryClearWarehouse(){
  const first = confirm(
    "⚠️ ВРЕМЕННАЯ КНОПКА\n\n" +
    "Удалить содержимое всех 450 обычных ячеек склада?\n\n" +
    "После этого можно будет загрузить новый Excel."
  );
  if(!first)return;

  const second = confirm(
    "Точно очистить ВСЕ 450 ячеек?\n\n" +
    "Это действие удалит данные из Firebase."
  );
  if(!second)return;

  try{
    const emptyCells=createEmptyData();

    // Сначала очищаем Firebase.
    await rootRef.child("cells").set(emptyCells);

    // Локальное состояние обновляем только после успешной записи.
    data=emptyCells;
    setLocal();
    render();
    doSearch();

    setSync("🗑️ Склад очищен","ok");

function normalizeSearchText(value){
  return String(value||"")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/й/g,"и")
    .replace(/[^a-zа-я0-9]+/g," ")
    .trim();
}

function translitToLatin(value){
  const map={
    "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y",
    "к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
    "ф":"f","х":"h","ц":"c","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e",
    "ю":"yu","я":"ya"
  };
  return normalizeSearchText(value).split("").map(ch=>map[ch]??ch).join("");
}

function fixKeyboardLayout(value){
  const ru="йцукенгшщзхъфывапролджэячсмитьбю";
  const en="qwertyuiop[]asdfghjkl;'zxcvbnm,.";
  const text=String(value||"").toLowerCase();
  return text.split("").map(ch=>{
    const i=ru.indexOf(ch);
    return i>=0 ? en[i] : ch;
  }).join("");
}

function levenshtein(a,b){
  if(a===b)return 0;
  if(!a)return b.length;
  if(!b)return a.length;
  if(a.length>b.length)[a,b]=[b,a];

  let prev=Array.from({length:a.length+1},(_,i)=>i);

  for(let j=1;j<=b.length;j++){
    const cur=[j];
    for(let i=1;i<=a.length;i++){
      cur[i]=Math.min(
        cur[i-1]+1,
        prev[i]+1,
        prev[i-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
    prev=cur;
  }
  return prev[a.length];
}

function expandSearchToken(token){
  const base=normalizeSearchText(token);
  const result=new Set([
    base,
    translitToLatin(base),
    normalizeSearchText(fixKeyboardLayout(base))
  ]);

  // Ищем совпадение в обе стороны:
  // "мазда" -> Mazda -> MZ
  // "Mazda" -> мазда -> MZ
  // "MZ" -> Mazda -> мазда
  for(const [key,aliases] of Object.entries(searchAliases)){
    const all=[key,...aliases].map(normalizeSearchText);

    if(all.includes(base)){
      all.forEach(x=>result.add(x));
    }
  }

  return [...result].filter(Boolean);
}

function isArticleLikeToken(token){
  const compact=normalizeSearchText(token).replace(/[^a-z0-9]/g,"");
  // Артикулы/коды вроде mz0903, apmz0903, 27c103, 81b103-j.
  // Для них нельзя использовать агрессивный fuzzy-поиск:
  // mz0903 не должен совпадать с mz0203c только из-за похожих цифр.
  return /^(?=.*[a-z])(?=.*\\d)[a-z0-9]+$/.test(compact) && compact.length>=4;
}

function articleTokenMatchesText(token,text){
  const q=normalizeSearchText(token).replace(/[^a-z0-9]/g,"");
  if(!q)return false;

  const normalized=normalizeSearchText(text);
  const words=normalized
    .split(/[^a-z0-9]+/)
    .map(x=>x.trim())
    .filter(Boolean);

  // Сначала строгое совпадение / вхождение.
  // Это позволяет mz0903 найти APMZ0903, но не mz0203c.
  if(words.some(w=>w===q || w.includes(q) || q.includes(w))) return true;

  // Разрешаем ровно одну опечатку только для достаточно длинного кода.
  // При этом сравниваем именно код, а не отдельные цифры в конце.
  if(q.length>=5){
    for(const w of words){
      if(Math.abs(w.length-q.length)>1)continue;
      if(levenshtein(q,w)<=1)return true;
    }
  }

  return false;
}

function queryTokenMatchesText(token,text){
  const normalized=normalizeSearchText(text);
  const textTokens=normalized.split(/\s+/).filter(Boolean);
  const compact=normalized.replace(/\s+/g,"");

  // Важный приоритет: если пользователь ввёл артикул/код,
  // не применяем общий fuzzy-поиск по 2-3 случайным цифрам.
  if(isArticleLikeToken(token)){
    return articleTokenMatchesText(token,text);
  }

  for(const variant of expandSearchToken(token)){
    if(!variant)continue;
    if(compact.includes(variant))return true;

    for(const word of textTokens){
      if(word.startsWith(variant))return true;

      if(variant.length>=3 && word.length>=3){
        const distance=levenshtein(variant,word);
        const maxDistance=variant.length<=4?1:variant.length<=7?2:3;
        if(distance<=maxDistance)return true;
      }
    }
  }

  return false;
}

}

}

function partMatchesValue(part,value){
  const types=codePartTypes(value);

  if(types.size){
    const aliases=partTypeAliases[part]||[part];
    return aliases.some(x=>types.has(normalizeSearchText(x)));
  }

  const aliases=partTypeAliases[part]||[part];
  return aliases.some(x=>queryTokenMatchesText(x,value));
}

function searchScore(queryTokens,text){
  let score=0;

  for(const rawToken of queryTokens){
    const brand=tokenIsBrand(rawToken);
    const part=tokenIsPartType(rawToken);

    if(brand){
      // Марка должна совпасть строго по названию в этой строке
      // или по коду марки в её артикуле.
      if(brandMatchesValue(brand,text)) score+=120;
      else return 0;
      continue;
    }

    if(part){
      if(partMatchesValue(part,text)) score+=120;
      else return 0;
      continue;
    }

    if(queryTokenMatchesText(rawToken,text)) score+=80;
    else return 0;
  }

  return score;
}

function parseExcelLocations(value){
  const result=[];
  const text=String(value||"").toUpperCase();

  // 1С может писать:
  // S5, A3
  // S5, A2, A3
  // (S5, A3) (S4, F3)
  // S4, F6,F7,F8
  //
  // Ищем каждую улицу S1-S5, а затем все пары
  // "буква полки + номер" до следующей улицы.
  const streetRe=/S\s*([1-5])/gi;
  const streets=[...text.matchAll(streetRe)];

  for(let i=0;i<streets.length;i++){
    const street=Number(streets[i][1]);
    const from=streets[i].index+streets[i][0].length;
    const to=i+1<streets.length ? streets[i+1].index : text.length;
    const part=text.slice(from,to);

    const shelfRe=/([A-EFGHJK])\s*(?:[-–—])?\s*([0-9]{1,2})/gi;

    for(const match of part.matchAll(shelfRe)){
      const letter=match[1].toUpperCase();
      const num=Number(match[2]);

      if(num<1 || num>10)continue;

      // На S1 у текущей карты есть только левая сторона A-E.
      if(street===1 && !leftLetters.includes(letter))continue;

      if(street>=2 && street<=5 && !letters.includes(letter))continue;

      result.push(`S${street}-${letter}-${num}`);
    }
  }

  return [...new Set(result)];
}

function findExcelColumns(row,columnMap){

  const articleIndex=columnMap?.article ?? (cells.length===3 ? 1 : 2);

async function importExcelFile(file){
  if(!file)return;

  if(typeof XLSX==="undefined"){
    alert("Не удалось загрузить модуль Excel. Обнови страницу и попробуй ещё раз.");
    return;
  }

  try{
    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:"array",cellDates:false});
    const sheet=workbook.Sheets[workbook.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false});

    if(!rows.length){
      alert("Excel пустой.");
      return;
    }

    // Определяем колонки по заголовкам. Текущий Excel из 1С:
    // A = Описание, B = Артикул, C = Ячейка.
    const headers=(rows[0]||[]).map(v=>String(v||"").trim().toLowerCase());

    const columnMap={
      description: headers.findIndex(h =>
        /описан|наимен|назван/.test(h)
      ),
      article: headers.findIndex(h =>
        /артикул|код/.test(h)
      ),
      location: headers.findIndex(h =>
        /ячейк|адрес|место.*хран|хранен/.test(h)
      )
    };

    // Excel из 1С может приходить вообще без заголовков.
    // Например:
    // A = Описание, B = Артикул, C = Ячейка, D = Количество
    // Причём первая строка иногда полностью пустая.
    // Поэтому определяем колонку адреса по реальным значениям, а не
    // предполагаем, что при 4 колонках адрес находится в D.
    const sampleRows=rows.slice(0,Math.min(rows.length,15));

    if(columnMap.location<0){
      for(let c=0;c<(rows[0]||[]).length;c++){
        const sample=sampleRows
          .map(r=>String(r?.[c]??"").toUpperCase())
          .join(" ");
        if(/\\bS[1-5]\\s*[,\-]\s*[A-K]\\s*[-,]?\\s*\\d{1,2}/i.test(sample) ||
           /\\bS[1-5]\\b/i.test(sample)){
          columnMap.location=c;
          break;
        }
      }
    }

    if(columnMap.description<0 || columnMap.article<0){
      // Для беззаголовочного файла сначала используем типичный
      // формат 3/4 колонок: Описание | Артикул | Ячейка | Количество.
      const count=Math.max(...rows.map(r=>(r||[]).length),0);
      if(count>=3){
        if(columnMap.description<0) columnMap.description=0;
        if(columnMap.location<0) columnMap.location=2;
        if(columnMap.article<0){
          columnMap.article = columnMap.location>0 ? columnMap.location-1 : 1;
        }
      }
    }

    // Если заголовок всё-таки распознан, его схема имеет приоритет.
    // Если колонка артикула не определилась, берём колонку перед адресом.
    if(columnMap.article<0 && columnMap.location>0)
      columnMap.article=columnMap.location-1;
    if(columnMap.description<0 && columnMap.article>0)
      columnMap.description=columnMap.article-1;

    const imported={};
    const skipped=[];
    let rowCount=0;
    let locationCount=0;

    // Не привязываемся к первой строке: она может быть пустой или
    // содержать заголовок. findExcelColumns() пропустит пустые строки.
    for(let i=0;i<rows.length;i++){
      const row=rows[i]||[];
      const {description,article,location}=findExcelColumns(row,columnMap);

      if(!description && !article && !location)continue;
      rowCount++;

      if(!article){
        skipped.push({row:i+1,reason:"не найден артикул"});
        continue;
      }

      if(!location){
        skipped.push({row:i+1,reason:"нет адреса хранения"});
        continue;
      }

      const locations=parseExcelLocations(location);

      if(!locations.length){
        // Например строка "S4" означает только улицу,
        // но не конкретную ячейку. Её нельзя безопасно
        // положить в карту автоматически.
        skipped.push({
          row:i+1,
          reason:`нет конкретной ячейки: ${location}`
        });
        continue;
      }

      const content=description
        ? `${article} — ${description}`
        : article;

      for(const addr of locations){
        if(!imported[addr])imported[addr]=[];

        if(!imported[addr].includes(content)){
          imported[addr].push(content);
          locationCount++;
        }
      }
    }

    const addresses=Object.keys(imported);

    if(!addresses.length){
      alert(
        `Excel прочитан, но конкретных ячеек не найдено.\\n\\n`+
        `Строк с данными: ${rowCount}\\n`+
        `Пример ожидаемого адреса: S5, A3 или S4, F6,F7,F8.`
      );
      return;
    }

    const preview=addresses.slice(0,10).map(addr=>{
      return `${addr}\\n${imported[addr].join("\\n")}`;
    }).join("\\n\\n");

    const more=addresses.length>10
      ? `\\n\\n…и ещё ${addresses.length-10} ячеек.`
      : "";

    const skippedPreview=skipped.slice(0,5).map(x=>{
      return `строка ${x.row}: ${x.reason}`;
    }).join("\\n");

    const skippedMore=skipped.length>5
      ? `\\n…и ещё ${skipped.length-5}.`
      : "";

    const ok=confirm(
      `Excel: ${file.name}\\n\\n`+
      `Строк с данными: ${rowCount}\\n`+
      `Ячеек для заполнения: ${addresses.length}\\n`+
      `Записей: ${locationCount}\\n`+
      `Пропущено строк: ${skipped.length}\\n\\n`+
      `Пример:\\n${preview}${more}`+
      (skipped.length
        ? `\\n\\nПропущенные строки:\\n${skippedPreview}${skippedMore}`
        : "")+
      `\\n\\nЗагрузить эти данные на карту?`
    );

    if(!ok)return;

    // Формируем только те ячейки, которые пришли из Excel.
    // Используем частичное обновление Firebase, чтобы импорт:
    // 1) не перезаписывал весь склад;
    // 2) не удалял существующие ячейки;
    // 3) не зависел от размера всего объекта data.
    const patch={};
    const validAddresses=[];

    for(const addr of addresses){
      const match=addr.match(/^S([1-5])-([A-K])-(\d+)$/);
      if(!match)continue;

      const [,s,l,n]=match;
      const value=imported[addr].join("\n");

      if(!data[`S${s}`] || !data[`S${s}`][l]){
        continue;
      }

      if(!data[`S${s}`][l][n] && value){
        // просто для читаемости; значение всё равно будет записано ниже
      }

      patch[`S${s}/${l}/${n}`]=value;
      validAddresses.push(addr);
    }

    if(!validAddresses.length){
      alert("Excel распознан, но ни одного адреса карты не удалось подготовить к записи.");
      return;
    }

    try{
      // Сначала записываем в Firebase.
      // Если Firebase отклонит запись, данные на карте не меняем.
      await rootRef.child("cells").update(patch);

      // После успешной записи обновляем локальное состояние.
      for(const addr of validAddresses){
        const match=addr.match(/^S([1-5])-([A-K])-(\d+)$/);
        const [,s,l,n]=match;
        data[`S${s}`][l][n]=imported[addr].join("\n");
      }

      setLocal();
      render();
      doSearch();

      setSync(`☁️ Excel загружен: ${validAddresses.length} ячеек`,"ok");

      alert(
        `Готово!\\n\\n`+
        `Загружено ячеек: ${validAddresses.length}\\n`+
        `Записей: ${locationCount}\\n`+
        (skipped.length
          ? `Пропущено строк: ${skipped.length}`
          : "Все строки с адресами обработаны.")
      );

    }catch(e){
      console.error("Excel import Firebase error:",e);

      setSync(
        `⚠️ Ошибка загрузки Excel: ${e?.code||"Firebase"}`,
        "err"
      );

      alert(
        `Excel распознан, но Firebase не разрешил записать данные.\\n\\n`+
        `Ошибка: ${e?.code||e?.message||e}\\n\\n`+
        `Если здесь написано PERMISSION_DENIED — проверь права записи для твоего Google-аккаунта.`
      );

      return;
    }


    if(skipped.length){
      console.warn("Пропущенные строки Excel:",skipped);
    }

  }catch(err){
    console.error(err);
    alert("Ошибка чтения Excel: "+(err?.message||err));
  }
}

  const file=e.target.files?.[0];

function doSearch(){
  const raw=document.getElementById("search").value.trim();
  const out=document.getElementById("results");

  if(!raw){
    out.innerHTML="";
    return;
  }

  const queryTokens=searchTokens(raw);
  const found=[];

  for(let s=1;s<=5;s++){
    const ls=s===1?leftLetters:letters;

    for(const l of ls){
      for(let n=1;n<=10;n++){
        const v=data["S"+s][l][String(n)]||"";
        const a=address("S"+s,l,n);

        // Проверяем каждую запись внутри ячейки отдельно.
        // Например, запрос mz0903 должен показать только APMZ0903,
        // а не соседний APMZ0203C из той же ячейки.
        const lines=String(v).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
        const matchedLines=lines
          .map(line=>({line,score:searchScore(queryTokens,line)}))
          .filter(x=>x.score>0);

        // Если ищем именно адрес, показываем всю ячейку.
        const addressMatch=queryTokenMatchesText(raw,a);
        const score=matchedLines.length
          ? Math.max(...matchedLines.map(x=>x.score))
          : (addressMatch ? 200 : 0);

        if(score>0){
          found.push({
            a,v,
            matchedLines:matchedLines.map(x=>x.line),
            s:"S"+s,l,n:String(n),score
          });
        }
      }
    }
  }

  for(const type of ["resale","defect"]){
    const v=specialData[type]||"";
    const a=type==="resale"?"Перекупной товар":"Брак";
    const score=searchScore(queryTokens,`${a} ${v}`);

    if(score>0){
      found.push({a,v,special:type,score});
    }
  }

  found.sort((a,b)=>b.score-a.score);

  if(!found.length){
    out.innerHTML='<div class="result">Ничего не найдено.</div>';
    return;
  }

  out.innerHTML=
    `<div style="font-weight:700;margin:8px 0">Найдено: ${found.length}</div>`+
    found.map(x=>x.special
      ? `<div class="result" onclick="openSpecial('${x.special}')">
           <strong>${esc(x.a)}</strong>
           <span class="article">${esc(x.v||"пусто")}</span>
         </div>`
      : `<div class="result" onclick="openModal('${x.s}','${x.l}','${x.n}')">
           <strong>${esc(x.a)}</strong>
           <span class="article">${esc(
             x.matchedLines?.length ? x.matchedLines.join("\n") : (x.v||"пусто")
           ).replace(/\n/g,"<br>")}</span>
         </div>`
    ).join("");
}

document.getElementById("search").addEventListener("input",()=>{render();doSearch()});
